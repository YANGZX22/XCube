<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">XCube unknown-space logo</title>
  <desc id="desc">A sharp X with a central void inside an incomplete isometric cube.</desc>

  <!-- Pure-color background -->
  <rect width="1024" height="1024" rx="224" fill="#17132E"/>

  <!-- Broken cube frame: the missing edges make its depth intentionally ambiguous. -->
  <g
    id="cube-frame"
    fill="none"
    stroke="#8576FF"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M512 174 792 336V660L512 822 232 660V336Z"/>
    <path d="M232 336 360 410"/>
    <path d="M664 410 792 336"/>
    <path d="M512 674V822"/>
  </g>

  <!-- A precise diagonal X. The diamond aperture suggests an unexplored core. -->
  <path
    id="xcube-x"
    fill="#FFFFFF"
    fill-rule="evenodd"
    d="
      M294 310
      H390
      L512 438
      L634 310
      H730
      L566 512
      L730 714
      H634
      L512 586
      L390 714
      H294
      L458 512
      Z

      M512 466
      L558 512
      L512 558
      L466 512
      Z
    "
  />
</svg>
